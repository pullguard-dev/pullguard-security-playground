name: PullGuard
# WHY workflow_dispatch: the daily canary re-runs this workflow's latest demo-PR
# run, but GitHub refuses re-runs of runs older than 30 days — the canary falls
# back to dispatching a fresh run on the demo branch (see canary.yml).
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
  checks: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pullguard-dev/pullguard-action@v1
        with:
          license-key: ${{ secrets.PULLGUARD_LICENSE_KEY }}
          report-to-app: true
          blame: true
          collapse-preexisting-security: true
